name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/raritan

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_dev.txt
      - run: pytest --cov-fail-under=90
      - name: Coverage gate per-module
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          from pathlib import PurePosixPath
          root = ET.parse('coverage.xml').getroot()
          gates = {
              'api.py': 95.0,
              'coordinator.py': 95.0,
              'config_flow.py': 95.0,
          }
          seen = {}
          for cls in root.iter('class'):
              name = PurePosixPath(cls.get('filename', '')).name
              if name in gates:
                  seen[name] = float(cls.get('line-rate', 0)) * 100
          for name, pct in sorted(seen.items()):
              print(f'{name}: {pct:.1f}% (gate {gates[name]}%)')
          missing = sorted(gates.keys() - seen.keys())
          if missing:
              print('Gated modules absent from coverage.xml:', ', '.join(missing))
          failed = [f'{n}: {p:.1f}% < {gates[n]}%' for n, p in sorted(seen.items()) if p < gates[n]]
          if failed:
              print('Per-module coverage failures:')
              for f in failed:
                  print(' -', f)
          if missing or failed:
              raise SystemExit(1)
          print('Per-module coverage gates passed.')
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-html
          path: htmlcov/

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb  # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: integration
          # Brand images live in the home-assistant/brands repo, which a new
          # custom integration has not been added to yet. Drop this once the
          # brand PR is merged so the check validates the icons too.
          ignore: brands
