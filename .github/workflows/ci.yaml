name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/raritan

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_dev.txt
      - run: pytest --cov-fail-under=90
      - name: Coverage gate per-module
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          gates = {
              'custom_components/raritan/api.py': 95.0,
              'custom_components/raritan/coordinator.py': 95.0,
              'custom_components/raritan/config_flow.py': 95.0,
          }
          failed = []
          for cls in root.iter('class'):
              fname = cls.get('filename', '')
              for path, target in gates.items():
                  if fname.endswith(path.split('/')[-1]) and path in fname:
                      pct = float(cls.get('line-rate', 0)) * 100
                      if pct < target:
                          failed.append(f'{fname}: {pct:.1f}% < {target}%')
          if failed:
              print('Per-module coverage failures:')
              for f in failed:
                  print(' -', f)
              raise SystemExit(1)
          print('Per-module coverage gates passed.')
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-html
          path: htmlcov/

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: home-assistant/actions/hassfest@e91ad1948e57189485b9c1ad608af0c303946f89  # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: integration
          # Brand images live in the home-assistant/brands repo, which a new
          # custom integration has not been added to yet. Drop this once the
          # brand PR is merged so the check validates the icons too.
          ignore: brands
