name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run so newly published CodeQL queries also scan the released code.
    - cron: "27 4 * * 1"

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      # Python needs no build step; CodeQL extracts directly from source.
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
