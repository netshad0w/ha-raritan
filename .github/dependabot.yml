version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # homeassistant is pinned to the version declared in hacs.json; bumping it
      # here would drift the two apart, so leave it to a deliberate manual bump.
      - dependency-name: "homeassistant"
