version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # homeassistant and the libraries it pulls in (DHCP discovery stack,
      # the test harness) must track the homeassistant pin in hacs.json, so
      # leave them to a deliberate manual bump rather than per-package PRs.
      - dependency-name: "homeassistant"
      - dependency-name: "aiodhcpwatcher"
      - dependency-name: "aiodiscover"
      - dependency-name: "cached-ipaddress"
      - dependency-name: "pytest-homeassistant-custom-component"
      - dependency-name: "pytest"
      - dependency-name: "pytest-cov"
      - dependency-name: "pytest-asyncio"
